[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits -%}
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/sulabi/keyrun/commit/{{ commit.id }}))
{% endfor -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "(?i)^feat", group = "Features" },
  { message = "(?i)^fix", group = "Bug Fixes" },
  { message = "(?i)^perf", group = "Performance" },
  { message = "(?i)^refactor", group = "Refactoring" },
  { message = "(?i)^docs", group = "Documentation" },
  { message = "(?i)^test", group = "Tests" },
  { message = "(?i)^(ci|build|chore|style)", group = "Maintenance" },
  { message = ".*", group = "Other" },
]
filter_commits = false
tag_pattern = "^v[0-9]"
sort_commits = "newest"
