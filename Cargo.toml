[package]
name = "keyrun"
version = "1.0.0"
edition = "2024"
description = "linux keybased app launcher"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
configfs = { version = "0.2.3", features = ["system-dirs"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
evdev = "0.13.2"
nix = { version = "0.31.3", features = ["poll"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
udev = "0.9.3"

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["precommit-hook", "run-cargo-clippy", "run-cargo-fmt"]

[features]
default = []
overlay = ["dep:eframe"]

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
